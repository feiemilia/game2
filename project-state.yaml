project_id: dream-sprite-financial-literacy
mode: continuous
current_phase: dt-ideate
requirements_version: 0.2
gate_status: pending
dt_handoff: pending
sdlc_release: pending
final_acceptance: pending
confirmed:
  - Audience: elementary-school learners
  - Subject: everyday personal finance, saving, and age-appropriate investment concepts
  - Game length: two levels, each with one required interactive learning activity
  - Progression: each level awards a key only after its challenge is solved
  - Feedback: show score per level and a final learning progress summary
  - Learning priority: learning outcomes (Learning-first profile)
  - Integrity and accessibility: strongly penalize guessing/exploitation and cognitive overload
  - Delivery: local Web export and deployment to the public feiemilia/game2 GitHub repository; GitHub Pages hosting requested on 2026-11-24
  - Visual reference: user-provided Little Nightmares Steam page and attached illustrated references; use only as mood/reference, not copied assets
assumptions:
  - Age band is approximately 8-12; exact grade, language, and curriculum standards are not yet specified
  - Two-level scope should focus on goal-based budgeting/saving and risk-aware investing, without financial advice
  - Existing Godot project is an incumbent prototype, not yet the user's approved final gameplay direction
  - Observe learning with task accuracy plus a brief explain-your-choice prompt; observe guessing/overload through interaction events and playtest notes
open_questions:
  - Human selection of gameplay concept from the blind tournament shortlist
  - Human selection of one visual direction after gameplay approval
  - Exact grade, localization, and school curriculum alignment
  - Human acceptance after local Web build review
