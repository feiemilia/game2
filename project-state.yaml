  - GUI launch and core input smoke test
  - Web export completes with project assets included
  - Local web server can serve exported entry point and wasm/pck assets
  - GitHub Pages workflow completes and published URL loads the game
passed_tests:
  - Godot 4.7.2 headless gameplay flow smoke test: title, movement, score, retry, keys, both levels, results
  - Godot 4.7.2 Web Release export succeeded; HTML, JavaScript, WebAssembly, and PCK outputs were created
  - GitHub Pages deployment completed; homepage and JavaScript/WASM/PCK assets returned HTTP 200
known_limitations:
  - Existing tests are automated smoke coverage, not evidence of improved student learning
  - Web export uses a project-scoped official Godot 4.7.2 template; it is not installed in the default user template directory
  - Local browser preview was not verified because this environment denied local loopback socket access
